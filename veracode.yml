# This is a configuration file used to configure The Veracode scanner. It supplements the default configuration for projects
# using java.
# Example comments
#  trying on diff branch an PR to "release*"
debug: true

veracode_static_scan:
  push:
    trigger: true
    # Please only specify either branches_to_run or branches_to_exclude
    # Entering both will only execute branches_to_run
    # Leaving them both blank means this will never run
    branches_to_run:
      - release*
      - main
    branches_to_exclude:
  pull_request:
    trigger: true
    action:
      - opened
      - synchronize
    target_branch:
      - release*
      - main


actions:
  veracode_static_scan:
    build:
      predependency_command: | 
        export VERACODE_PACKAGE_JAVA_SOURCE=true
        # testing whether source is visible on the platform
